spring.application.name=Backend

# PostgreSQL Database Configuration (Digital Ocean Managed PostgreSQL)
spring.datasource.url=jdbc:postgresql://db-postgresql-blr1-97829-do-user-37647391-0.k.db.ondigitalocean.com:25060/defaultdb?sslmode=require
spring.datasource.username=doadmin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
